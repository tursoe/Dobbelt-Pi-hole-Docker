# Minimal stand-in for a Pi-hole API, used only by tests/smoke.sh.
server {
    listen 80;
    location = /api/auth {
        default_type application/json;
        return 200 '{"session":{"valid":false,"sid":null,"message":"no SID provided"}}';
    }
    location = /api/groups {
        default_type application/json;
        return 200 '{"groups":[{"id":0,"name":"Default","enabled":true}]}';
    }
    location = /api/config/dns/cnameRecords {
        default_type application/json;
        return 200 '{"config":{"dns":{"cnameRecords":["alias.test,target.test,60"]}}}';
    }
    location = /api/network/devices {
        default_type application/json;
        return 200 '{"devices":[],"requested_limits":"$args"}';
    }
    location = /api/network/devices/12 {
        if ($request_method != DELETE) { return 405; }
        return 204;
    }
    location = /api/teleporter {
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="pi-hole-backup.zip"';
        return 200 'PK-mock-archive';
    }
}
